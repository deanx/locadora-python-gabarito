repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (erros e estilo)
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formatação)
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy (tipos)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: regras-locadora
        name: regras da locadora (LOC001, LOC002)
        entry: python v6/ferramentas/regras_locadora.py
        language: system
        types: [python]
